<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple">
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>
<section class="p-4 p-md-5 h-auto" style="
    background-image: url(https://mdbcdn.b-cdn.net/img/Photos/Others/background3.webp);
    background-size: cover;
  ">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <app-payment (onSubmit)="getCards()" [card]="card()"></app-payment>
      </div>

      <div class="col-12">
        <div class="row">
          @for (card of cards(); track card?.paymentId) {
          <div
            class="col-12 col-md-6 col-xl-4 mb-4 mt-3"
            style="cursor: pointer;"
            (click)="getNumber(card)">
            <div class="payment-card">
              <div class="card-top">
                <span class="card-label">CREDIT CARD</span>
                <i class="fa fa-wifi contactless-icon"></i>
              </div>

              <!-- Delete button -->
              <button
                type="button"
                class="delete-card-btn"
                title="Delete payment card"
                aria-label="Delete payment card"
                (click)="deleteCard(card?.paymentId)">
                <i class="fa fa-trash"></i>
              </button>

              <div class="card-chip">
                <div class="chip-line"></div>
              </div>

              <div class="card-number">
                {{ getCardNumber(card?.cardNumber) }}
              </div>

              <div class="card-bottom">
                <div class="card-details">
                  <span class="detail-label">CARD HOLDER</span>
                  <span class="card-holder">{{ card?.cardName }}</span>
                </div>

                <div class="card-details expiry">
                  <span class="detail-label">EXPIRES</span>
                  <span class="expiry-date">
                    {{ getCardExpiryDate(card?.expiredDate) }}
                  </span>
                </div>

                <div class="card-brand">VISA</div>
              </div>
            </div>
          </div>
          }
        </div>
      </div>

    </div>
  </div>
</section>
